<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RomM (Go) — Phase 1</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 42rem; padding: 0 1rem; }
      code { background: color-mix(in srgb, currentColor 12%, transparent); padding: .1em .35em; border-radius: 4px; }
      pre { background: color-mix(in srgb, currentColor 8%, transparent); padding: 1rem; border-radius: 8px; overflow:auto; }
    </style>
  </head>
  <body>
    <h1>RomM — Go backend (Phase 1)</h1>
    <p>Single-binary rewrite scaffold. This placeholder is replaced by the built Vue SPA in a later phase.</p>
    <p>Live endpoints:</p>
    <ul>
      <li><a href="/api/heartbeat">/api/heartbeat</a> — version + library counts from the DB</li>
      <li><a href="/api/roms?limit=20">/api/roms?limit=20</a> — read-only roms list</li>
    </ul>
    <pre id="hb">loading…</pre>
    <script>
      fetch("/api/heartbeat").then(r => r.json()).then(j => {
        document.getElementById("hb").textContent = JSON.stringify(j, null, 2);
      }).catch(e => { document.getElementById("hb").textContent = String(e); });
    </script>
  </body>
</html>
